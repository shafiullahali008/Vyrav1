
name: VYRA Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build VYRA debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          for attempt in 1 2 3; do
            echo "SDK installation attempt $attempt"

            if "$SDKMANAGER" --install \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0"; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: Android SDK installation failed after 3 attempts"
              exit 1
            fi

            sleep 15
          done

      - name: Locate and extract VYRA source
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No source ZIP found in repository"
            exit 1
          fi

          echo "Using source archive: $ZIP_FILE"

          mkdir -p "$GITHUB_WORKSPACE/vyra-source"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/vyra-source"

          GRADLE_FILE="$(find "$GITHUB_WORKSPACE/vyra-source" -type f -name gradlew | head -n 1)"

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: Gradle wrapper not found in source ZIP"
            exit 1
          fi

          echo "GRADLE_DIR=$(dirname "$GRADLE_FILE")" >> "$GITHUB_ENV"

      - name: Verify build environment
        shell: bash
        run: |
          set -e

          echo "Java version:"
          java -version

          echo "Gradle wrapper:"
          ls -l "$GRADLE_DIR/gradlew"

          echo "Android SDK:"
          ls "$ANDROID_HOME"

          chmod +x "$GRADLE_DIR/gradlew"

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$GRADLE_DIR"
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload VYRA APK
        uses: actions/upload-artifact@v4
        with:
          name: VYRA-Android-APK
          path: |
            ${{ env.GRADLE_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
